# Noted API, OpenAPI 3.1. Generated by backend/scripts/build_api_spec.py; edit that script, not this file.
openapi: 3.1.0
info:
  title: Noted API
  version: 2.0.0
  description: 'Backend for Noted, the front-desk operations app for residential buildings. Managers run a property; concierges
    work shifts at its desk.


    **Auth.** Sign in (or sign up) to get a session token, then send `Authorization: Bearer <token>`. The server also sets
    an httpOnly `session_token` cookie; the header wins when both are present. Sessions last 30 days.


    **Scope.** Everything is scoped to the signed-in person''s property (their manager). Nobody can read or change another
    property''s data; a record from another property answers 404.


    **Errors.** Errors are JSON `{"detail": "..."}` with a sentence the app can show as it is.


    Generated by `backend/scripts/build_api_spec.py`; see docs/api/API.md for the readable version.'
paths:
  /api/auth/manager/signup:
    post:
      summary: Create a manager account and property
      operationId: manager_signup_api_auth_manager_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerSignupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Password must be at least 8 characters. / Enter a valid email address. / Enter your first name. / Enter
            at least 1 unit. / An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request validation failed (missing or wrong-type field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
      description: '**Who:** Public.


        Creates the manager and signs them in (also sets the `session_token` cookie). Sends a welcome email in the background.'
      x-noted-role: public
      security: []
  /api/auth/signin:
    post:
      summary: Sign in
      operationId: signin_api_auth_signin_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Role must be "manager" or "concierge".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
