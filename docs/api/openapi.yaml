      properties:
        done_count: *id005
        last_done:
          type:
          - object
          - 'null'
          properties:
            date: *id006
            by: *id001
            at: *id002
        recent:
          type: array
          items:
            type: object
            properties:
              date: *id006
              status: *id001
              by: *id001
              note: *id001
      description: How often a planned task was done, with up to 14 recent days.
    ScheduledTask:
      type: object
      properties:
        scheduled_task_id: *id001
        manager_id: *id001
        title: *id001
        notes: *id001
        category: *id001
        priority: *id001
        recurrence: *id001
        scheduled_hour:
          type:
          - integer
          - 'null'
        shift_window: *id001
        assigned_concierge_id: *id001
        assigned_concierge_name: *id001
        assigned_to: *id001
        assigned_to_id: *id001
        start_date: *id006
        end_date:
          type:
          - string
          - 'null'
          format: date
        repeat:
          type: string
          enum:
          - once
          - daily
          - days
          - weekly
          - monthly
        days_of_week:
          type: array
          items: *id005
          description: 0 = Monday … 6 = Sunday.
        scheduled_time:
          type: string
          description: HH:MM, 24-hour.
        end_time: *id001
        active: *id003
        created_by: *id001
        created_by_name: *id001
        created_by_type: *id001
        created_at: *id002
        history:
          $ref: '#/components/schemas/PlanHistory'
      required:
      - scheduled_task_id
      - title
      - repeat
      - start_date
    CalendarItem:
      type: object
      properties:
        scheduled_task_id: *id001
        title: *id001
        notes: *id001
        category: *id001
        time: *id001
        end_time: *id001
        repeat: *id001
        for_name: *id001
        added_by: *id001
        added_by_type: *id001
        mine:
          type: boolean
          description: 'True when the caller may edit it (managers: always; desk: what it added).'
        status:
          type: string
          description: '`planned` until a copy exists, then that copy''s status.'
        done_by: *id001
    Incident:
      type: object
      properties:
        incident_id: *id001
        manager_id: *id001
        shift_id: *id004
        type: *id001
        location: *id001
        description: *id001
        severity:
          type: string
          description: low, medium, high or critical.
        notes: *id004
        unit_number: *id001
        person_involved: *id001
        evidence_urls:
          type: array
          items: *id001
        status:
          type: string
          description: Starts as `new`; the manager sets it (e.g. `resolved`).
        created_by:
          type: string
          description: Name of the person who filed it.
        created_by_type: *id001
        created_at: *id002
        resolved_at: *id002
        resolved_by: *id001
        resolved_note: *id001
      required:
      - incident_id
      - type
      - location
      - description
      - status
    Shift:
      type: object
      properties:
        shift_id: *id001
        concierge_id: *id001
        concierge_name: *id001
        manager_id: *id001
        property_name: *id001
        status:
          type: string
          enum:
          - active
          - completed
        clock_in: *id002
        clock_out:
          type:
          - string
          - 'null'
          format: date-time
        created_at: *id002
        handover_notes: *id001
        open_items:
          type: array
          items: *id001
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: What was done on the shift (the DAR), oldest first, plus `not_done` desk work once it has ended.
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
      required:
      - shift_id
      - concierge_id
      - status
      - clock_in
    ShiftResult:
      type: object
      properties:
        shift:
          anyOf:
          - $ref: '#/components/schemas/Shift'
          - type: 'null'
      required:
      - shift
    ChatMessage:
      type: object
      properties:
        message_id: *id001
        manager_id: *id001
        content: *id001
        message_type: *id001
        sender_name: *id001
        sender_id: *id001
        sender_type:
          type: string
          enum:
          - manager
          - concierge
        created_at: *id002
    Resident:
      type: object
      properties:
        resident_id: *id001
        manager_id: *id001
        name: *id001
        unit: *id001
        phone: *id001
        email: *id001
        notes: *id001
        created_at: *id002
      required:
      - resident_id
      - name
      - unit
    Analytics:
      type: object
      properties:
        totals:
          type: object
          properties:
            tasks: *id005
            completed_tasks: *id005
            completion_rate:
              type: number
              description: Percent, one decimal.
            incidents: *id005
            open_incidents: *id005
            shifts: *id005
        by_category:
          type: array
          items:
            type: object
            properties:
              category: *id001
              count: *id005
        by_status:
          type: array
          items:
            type: object
            properties:
              status: *id001
              count: *id005
        incidents_by_severity:
          type: array
          items:
            type: object
            properties:
              severity: *id001
              count: *id005
        incidents_by_type:
          type: array
          items:
            type: object
            properties:
              type: *id001
              count: *id005
        by_concierge:
          type: array
          items:
            type: object
            properties:
              name: *id001
              count: *id005
        hourly_activity:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
                description: 0–23, UTC.
              count: *id005
    AuditLog:
      type: object
      properties:
        log_id: *id001
        manager_id: *id001
        user_id: *id001
        user_type: *id001
        action:
          type: string
          description: create, update, delete, clock_in or clock_out.
        resource_type: *id001
        resource_id: *id001
        detail:
          type: object
        created_at: *id002
    PackageResult:
      type: object
      properties:
        sent:
          type: boolean
          description: True when a resident email was found for the unit and an email was attempted.
        resident_email: *id001
        resident_name: *id001
    ImageUpload:
      type: object
      properties:
        image_id: *id001
        url:
          type: string
          description: 'A data: URL (base64) of the image. Store it on the task or incident.'
    AssistantPlan:
      type: object
      properties:
        kind:
          type: string
          enum:
          - find
          - open
          - answer
          - log
          - package
          - visitor
          - vendor
          - incident
          - task
          - message
          - handoff
          - protocol
          - emergency
          - other
        reply: *id001
        ids:
          type: array
          items: *id001
          description: Up to 5 ids from the property record, best match first.
        open:
          type: string
          description: A section of the app to open.
        fields:
          type:
          - object
          - 'null'
          additionalProperties: *id001
          description: Draft entry values for entry kinds; the app shows a Ready to save card.
    AssistantResult:
      type: object
      properties:
        answer:
          anyOf:
          - $ref: '#/components/schemas/AssistantPlan'
          - type: 'null'
        reason:
          type: string
          enum:
          - ''
          - unavailable
          - limit
          - failed
          description: '`unavailable`: no ANTHROPIC_API_KEY on the server. `limit`: over 120 requests per hour. `failed`:
            the model did not answer.'
    Contact:
      type: object
      properties:
        contact_id: *id001
        manager_id: *id001
        label: *id001
        number: *id001
        category:
          type: string
          description: 'Suggested: Emergency services, Staff, Building & vendors. Any short label is kept.'
        role: *id001
        created_at: *id002
        updated_at: *id002
      required:
      - contact_id
      - label
      - number
    ContactsList:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        manager:
          type:
          - object
          - 'null'
          properties:
            name: *id001
            title: *id001
            phone: *id001
            email: *id001
    KnowledgeOut:
      type: object
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - sop
          - training
        title: *id001
        category: *id001
        body: *id001
        fileName: *id001
        fileType:
          type: string
          description: pdf, image, video or doc; empty when there is no file.
        dataURL:
          type: string
          description: 'Older items only: the file inline. Newer items have hasFile and are downloaded from …/file.'
        hasFile: *id003
        fileId: *id001
        fileSize: *id005
        mime: *id001
        status:
          type: string
          description: Defaults to `published`.
        completedBy:
          type: array
          items: *id001
          description: Names of concierges who marked it reviewed.
        completed:
          type: boolean
          description: Whether the caller marked it reviewed.
        updatedAt: *id002
      required:
      - id
      - kind
      - title
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from sign-in or sign-up (sess_…).
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Set by sign-in and sign-up.
servers:
- url: https://notes-slg9.onrender.com
  description: Production (Render)
- url: http://localhost:8001
  description: Local
tags:
- name: Health
  description: Is the server up, and is it set up.
- name: Auth
  description: Sign-up, sign-in, sessions, password reset and invitation links.
- name: Team
  description: Manager tools for concierge accounts, invitations and which shift sections each person sees.
- name: Shifts
  description: Clock in and out, the live report (DAR), handover and history.
- name: Tasks
  description: Requests from the manager and entries the desk logs.
- name: Follow-ups
  description: Tasks planned for later days, once or repeating, and the calendar of them.
- name: Incidents
  description: Incident reports.
- name: Messages
  description: The team thread and the live update stream.
- name: Residents
  description: Resident directory.
- name: Packages
  description: Package notices and photo upload.
- name: Analytics
  description: Numbers and the audit trail, for managers.
- name: Assistant
  description: The Noted Assistant server fallback.
- name: Contacts & SOPs
  description: Contact directory, SOPs and training material.
- name: Desk
  description: The desk's working lists, kept on the server so they survive a refresh and the next shift sees them.
